<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Guessing Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <section class="game-card">
      <header class="game-header">
        <div>
          <p class="eyebrow">WORD CHALLENGE</p>
          <h1>Guess the Word</h1>
        </div>
        <button id="restartButton" class="icon-button" type="button" aria-label="Restart game">↻</button>
      </header>

      <div class="stats">
        <div class="stat">
          <span class="stat-label">Score</span>
          <strong id="score">0</strong>
        </div>
        <div class="stat">
          <span class="stat-label">Streak</span>
          <strong id="streak">0</strong>
        </div>
        <div class="stat">
          <span class="stat-label">Time</span>
          <strong id="timer">15</strong>
        </div>
      </div>

      <div class="progress-track">
        <div id="progressBar" class="progress-bar"></div>
      </div>

      <section class="challenge">
        <p id="category" class="category">Category</p>
        <div id="scrambledWord" class="scrambled-word" aria-live="polite">-------</div>
        <p id="hint" class="hint">Hint will appear here</p>
      </section>

      <form id="guessForm" class="guess-form">
        <label for="guessInput" class="sr-only">Your guess</label>
        <input
          id="guessInput"
          type="text"
          autocomplete="off"
          autocapitalize="none"
          spellcheck="false"
          maxlength="20"
          placeholder="Type your guess..."
          aria-label="Type your guess"
        >
        <button type="submit" class="guess-button">Guess</button>
      </form>

      <div id="message" class="message" aria-live="polite"></div>

      <div class="keyboard" id="keyboard" aria-label="Virtual keyboard"></div>

      <footer class="game-footer">
        <span>Round <strong id="round">1</strong></span>
        <span>Best streak <strong id="bestStreak">0</strong></span>
      </footer>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
